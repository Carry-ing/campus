name: 部署到 GitHub Pages

# 只要 main 分支有更新，就自动把网页发布出去
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只挑出网页本身需要的文件：
      # server.js / __probe.html / scripts / .shots 是本地开发调试用的，不往线上发
      - name: 挑出静态文件
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css _site/
          cp -r js _site/
          touch _site/.nojekyll
          echo "将发布以下文件："
          find _site -type f | sort

      # enablement: true —— 仓库还没开启 Pages 时，自动帮你开启（用 GITHUB_TOKEN 调接口），
      # 这样就不用再去 Settings → Pages 手动点一次了
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
